name: doploy-project

on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name:  Setup PHP
        uses:  shivammathur/setup-php@v2
        with: 
             php-version: '8.4'

      - name:  Composer install
        run:  composer install --no-interaction --prefer-dist  
  
  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: into project
        run: |
          cd /home/deployment/laravel_advanced
          git pull origin main