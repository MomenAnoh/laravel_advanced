services:
    laravel-app:
        container_name: laravel-app
        build: .
        ports:
            - "8000:8000"
        depends_on:
            - database
        
        env_file:
               ./.env
        volumes:
            - ./:/var/www/html      

    database:
                container_name: mysql
                image: mysql:8.0
                restart: always
                environment:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: advanced

                ports:
                    - "3307:3306"
                volumes:
                    - db_data:/var/lib/mysql

    nginx:
        container_name: nginx
        image: nginx:alpine
        restart: always
        ports:
            - "80:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/app
        depends_on:
            - laravel-app                

volumes:
        db_data:



